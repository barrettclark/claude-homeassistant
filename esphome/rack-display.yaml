# Rack display firmware. See hardware/rack-display/ASSEMBLY.md for the
# build and wiring this implements. Hardware blocks (esp32/psram, the
# logger UART0 override, i2c, display, touch, backlight, PIR) are carried
# over unchanged from esphome/kitchen-dashboard.yaml — same board family.

esphome:
  name: rack-display
  friendly_name: Home Office Rack

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret rack_display_api_key

ota:
  - platform: esphome
    encryption:

# hardware_uart forced to UART0: this board's USB-C port runs through a
# discrete UART bridge chip, not the ESP32-S3's native USB peripheral —
# but that native peripheral is hard-wired to GPIO19/20 in silicon
# regardless, which would otherwise conflict with the I2C touch bus below.
logger:
  hardware_uart: UART0

# ESPHome will warn that GPIO19/20 are "used by the USB-Serial-JTAG
# interface" — that warning is generic to the ESP32-S3 chip and doesn't
# apply here now that the logger above is forced off that peripheral;
# these pins are free for I2C on this board. Expected, safe to ignore.
i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lvgl.label.update:
          id: time_label
          text: !lambda return id(ha_time).now().strftime("%I:%M %p");

# Board is a DIYmalls/Sunton ESP32-8048S043C. The "ESP32-8048S050" model
# below is the closest built-in ESPHome model — its pin mapping matches
# this exact board (verified against the physical board's photos), even
# though the model name refers to the 5.0" sibling panel.
display:
  - platform: mipi_rgb
    id: rack_display
    model: ESP32-8048S050

touchscreen:
  platform: gt911
  id: rack_touch
  display: rack_display
  on_touch:
    - script.execute: wake_display

output:
  - platform: ledc
    pin: GPIO2
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "Rack Display Backlight"
    restore_mode: ALWAYS_ON
    internal: true

# PIR wake source (board connector P4, pin IO17 — see ASSEMBLY.md for
# wiring). The MCU and WiFi stay running continuously; only the backlight
# is gated on idle.
binary_sensor:
  - platform: gpio
    id: pir_motion
    name: "Motion"
    device_class: motion
    pin:
      number: GPIO17
      mode: INPUT
    on_press:
      - script.execute: wake_display

script:
  - id: wake_display
    mode: restart
    then:
      - light.turn_on: backlight
      - script.execute: idle_timer

  - id: idle_timer
    mode: restart
    then:
      - delay: 45s
      - light.turn_off: backlight

# Rack-air temperature probe (DS18B20 via PlugableTerminal adapter,
# board connector P4 pin IO18 — see ASSEMBLY.md for wiring).
one_wire:
  - platform: gpio
    pin: GPIO18

sensor:
  - platform: dallas_temp
    id: rack_temp
    name: "Temperature"
    unit_of_measurement: "°F"
    update_interval: 60s
    filters:
      - lambda: return x * 1.8 + 32.0;
    # LVGL's text:/format:/args: only evaluates once, at widget creation —
    # it doesn't auto-refresh when the referenced sensor updates, so the
    # label has to be told to re-render on every new reading. Same pattern
    # repeats below for every HA-sourced sensor on the data pages.
    on_value:
      then:
        - lvgl.label.update:
            id: temp_label
            text:
              format: "%.1f°F"
              args:
                - id(rack_temp).state

  # Outside conditions (Tempest, via weather.coppell) — HA's unit system
  # here is already imperial, same as the Synology disk temps below, so
  # no conversion needed.
  - platform: homeassistant
    id: outside_temp
    entity_id: weather.coppell
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: outside_temp_label
            text:
              format: "%.1f°F"
              args:
                - id(outside_temp).state

  - platform: homeassistant
    id: outside_humidity
    entity_id: weather.coppell
    attribute: humidity
    on_value:
      then:
        - lvgl.label.update:
            id: outside_humidity_label
            text: !lambda return str_sprintf("%.0f%%", id(outside_humidity).state);

  - platform: homeassistant
    id: outside_wind
    entity_id: weather.coppell
    attribute: wind_speed
    on_value:
      then:
        - lvgl.label.update:
            id: outside_wind_label
            text:
              format: "%.0f mph"
              args:
                - id(outside_wind).state

  - platform: homeassistant
    id: outside_pressure
    entity_id: weather.coppell
    attribute: pressure
    on_value:
      then:
        - lvgl.label.update:
            id: outside_pressure_label
            text:
              format: "%.2f"
              args:
                - id(outside_pressure).state

  # Synology NAS ("boulevardier")
  - platform: homeassistant
    id: nas_vol1_used
    entity_id: sensor.boulevardier_volume_1_volume_used
    on_value:
      then:
        - lvgl.label.update:
            id: nas_vol1_used_label
            text: !lambda return str_sprintf("%.0f%%", id(nas_vol1_used).state);
        - lvgl.arc.update:
            id: arc_nas_vol1_used
            value: !lambda return (int) id(nas_vol1_used).state;

  - platform: homeassistant
    id: nas_vol2_used
    entity_id: sensor.boulevardier_volume_2_volume_used
    on_value:
      then:
        - lvgl.label.update:
            id: nas_vol2_used_label
            text: !lambda return str_sprintf("%.0f%%", id(nas_vol2_used).state);
        - lvgl.arc.update:
            id: arc_nas_vol2_used
            value: !lambda return (int) id(nas_vol2_used).state;

  - platform: homeassistant
    id: nas_vol1_temp
    entity_id: sensor.boulevardier_volume_1_average_disk_temp
    on_value:
      then:
        - lvgl.label.update:
            id: nas_vol1_temp_label
            text:
              format: "%.0f°F"
              args:
                - id(nas_vol1_temp).state

  - platform: homeassistant
    id: nas_vol2_temp
    entity_id: sensor.boulevardier_volume_2_average_disk_temp
    on_value:
      then:
        - lvgl.label.update:
            id: nas_vol2_temp_label
            text:
              format: "%.0f°F"
              args:
                - id(nas_vol2_temp).state

  - platform: homeassistant
    id: nas_cpu
    entity_id: sensor.boulevardier_cpu_utilization_total
    on_value:
      then:
        - lvgl.label.update:
            id: nas_cpu_label
            text: !lambda return str_sprintf("%.0f%%", id(nas_cpu).state);
        - lvgl.arc.update:
            id: arc_nas_cpu
            value: !lambda return (int) id(nas_cpu).state;

  - platform: homeassistant
    id: nas_mem
    entity_id: sensor.boulevardier_memory_usage_real
    on_value:
      then:
        - lvgl.label.update:
            id: nas_mem_label
            text: !lambda return str_sprintf("%.0f%%", id(nas_mem).state);
        - lvgl.arc.update:
            id: arc_nas_mem
            value: !lambda return (int) id(nas_mem).state;

  # ASUS router. Entity IDs are derived from the AsusWRT integration's
  # configured host, currently a placeholder IP (192.0.2.1) — if that's
  # ever corrected to the router's real LAN address these entity IDs
  # will change and need updating here too.
  - platform: homeassistant
    id: net_devices
    entity_id: sensor.192_0_2_1_devices_connected
    on_value:
      then:
        - lvgl.label.update:
            id: net_devices_label
            text:
              format: "%.0f"
              args:
                - id(net_devices).state

  # Download/upload speed via UPnP (not AsusWRT) — AsusWRT's own speed
  # sensors stayed disabled even after enabling + reloading in the HA UI;
  # these UPnP-sourced equivalents were already enabled and live.
  - platform: homeassistant
    id: net_download
    entity_id: sensor.rt_ac3100_4508_kib_s_received
    on_value:
      then:
        - lvgl.label.update:
            id: net_download_label
            text:
              format: "%.0f"
              args:
                - id(net_download).state

  - platform: homeassistant
    id: net_upload
    entity_id: sensor.rt_ac3100_4508_kib_s_sent
    on_value:
      then:
        - lvgl.label.update:
            id: net_upload_label
            text:
              format: "%.0f"
              args:
                - id(net_upload).state

  # Manhattan (Beelink), via Glances. Entity IDs are IP-derived, same
  # fragility as the AsusWRT/UPnP ones above — tied to its current
  # 192.0.2.200 DHCP reservation.
  - platform: homeassistant
    id: manhattan_cpu
    entity_id: sensor.office_192_0_2_200_cpu_usage
    on_value:
      then:
        - lvgl.label.update:
            id: manhattan_cpu_label
            text: !lambda |-
              if (std::isnan(id(manhattan_cpu).state)) return std::string("OFFLINE");
              return str_sprintf("%.0f%%", id(manhattan_cpu).state);
        - lvgl.arc.update:
            id: arc_manhattan_cpu
            value: !lambda |-
              return std::isnan(id(manhattan_cpu).state) ? 0 : (int) id(manhattan_cpu).state;

  - platform: homeassistant
    id: manhattan_mem
    entity_id: sensor.office_192_0_2_200_memory_usage
    on_value:
      then:
        - lvgl.label.update:
            id: manhattan_mem_label
            text: !lambda |-
              if (std::isnan(id(manhattan_mem).state)) return std::string("OFFLINE");
              return str_sprintf("%.0f%%", id(manhattan_mem).state);
        - lvgl.bar.update:
            id: bar_manhattan_mem
            value: !lambda |-
              return std::isnan(id(manhattan_mem).state) ? 0 : (int) id(manhattan_mem).state;

  - platform: homeassistant
    id: manhattan_swap
    entity_id: sensor.office_192_0_2_200_swap_usage
    on_value:
      then:
        - lvgl.label.update:
            id: manhattan_swap_label
            text: !lambda |-
              if (std::isnan(id(manhattan_swap).state)) return std::string("OFFLINE");
              return str_sprintf("%.0f%%", id(manhattan_swap).state);
        - lvgl.bar.update:
            id: bar_manhattan_swap
            value: !lambda |-
              return std::isnan(id(manhattan_swap).state) ? 0 : (int) id(manhattan_swap).state;

  - platform: homeassistant
    id: manhattan_temp
    entity_id: sensor.office_192_0_2_200_composite_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: manhattan_temp_label
            text: !lambda |-
              if (std::isnan(id(manhattan_temp).state)) return std::string("OFFLINE");
              return str_sprintf("%.0f°F", id(manhattan_temp).state);

  # UPS (CyberPower EC650LCD, via Synology NUT server)
  - platform: homeassistant
    id: ups_charge
    entity_id: sensor.office_ups_battery_charge
    on_value:
      then:
        - lvgl.label.update:
            id: ups_charge_label
            text: !lambda return str_sprintf("%.0f%%", id(ups_charge).state);
        - lvgl.arc.update:
            id: arc_ups_charge
            value: !lambda return (int) id(ups_charge).state;

  - platform: homeassistant
    id: ups_load
    entity_id: sensor.office_ups_load
    on_value:
      then:
        - lvgl.label.update:
            id: ups_load_label
            text: !lambda return str_sprintf("%.0f%%", id(ups_load).state);
        - lvgl.arc.update:
            id: arc_ups_load
            value: !lambda return (int) id(ups_load).state;

  - platform: homeassistant
    id: ups_voltage
    entity_id: sensor.office_ups_input_voltage
    on_value:
      then:
        - lvgl.label.update:
            id: ups_voltage_label
            text:
              format: "%.0fV"
              args:
                - id(ups_voltage).state

text_sensor:
  - platform: homeassistant
    id: outside_condition
    entity_id: weather.coppell
    on_value:
      then:
        - lvgl.label.update:
            id: outside_condition_label
            text: !lambda return id(outside_condition).state;

  # Bound to the raw NUT flag string (office_ups_status_data, e.g. "OL",
  # "OB"), not the human-readable sensor.office_ups_status — that one can
  # read "Online, Battery Charging" or similar, too long for this card.
  - platform: homeassistant
    id: ups_status
    entity_id: sensor.office_ups_status_data
    on_value:
      then:
        - lvgl.label.update:
            id: ups_status_label
            text: !lambda |-
              std::string s = id(ups_status).state;
              size_t pos = s.find(' ');
              return (pos == std::string::npos) ? s : s.substr(0, pos);

  # Friendly "Nd Hh" duration strings, computed in HA (config/packages/
  # package_rack_display_uptime.yaml) since the source sensors are boot
  # timestamps, not durations.
  - platform: homeassistant
    id: manhattan_uptime
    entity_id: sensor.manhattan_uptime
    on_value:
      then:
        - lvgl.label.update:
            id: manhattan_uptime_label
            text: !lambda return id(manhattan_uptime).state;

  - platform: homeassistant
    id: nas_uptime
    entity_id: sensor.boulevardier_uptime
    on_value:
      then:
        - lvgl.label.update:
            id: nas_uptime_label
            text: !lambda return id(nas_uptime).state;

interval:
  - interval: 30s
    then:
      - lvgl.label.update:
          id: time_label
          text: !lambda return id(ha_time).now().strftime("%I:%M %p");

# Single dashboard page. Layout is absolute x/y on a literal 800x480
# budget; flex is only used inside the header for right-aligning
# variable-width text.
#
# Two ESPHome/LVGL gotchas this layout depends on avoiding:
# - LVGL's default theme pads every obj ~20px per side (and between flex/
#   grid children). The theme override below zeroes that, so every pixel
#   of padding on the page is one declared here.
# - A `main:` block on a widget replaces ALL of its top-level properties
#   (width, height, x, y...), so main-part styling goes at the top level.
lvgl:
  displays:
    - rack_display
  touchscreens:
    - rack_touch
  theme:
    obj:
      pad_all: 0
      pad_row: 0
      pad_column: 0
  style_definitions:
    - id: card_style
      bg_color: 0x1E2029
      bg_opa: COVER
      radius: 10
      border_width: 2
    - id: container_style
      bg_opa: TRANSP
      border_width: 0
      radius: 0
    - id: page_title_style
      text_color: 0x4FC3F7
      text_font: montserrat_18
    - id: page_subtitle_style
      text_color: 0xB8C0D0
      text_font: montserrat_12
    - id: section_header_style
      text_color: 0x8A94A8
      text_font: montserrat_14
    - id: card_value_style
      text_color: 0xE8ECF4
      text_font: montserrat_18
    - id: hero_value_style
      text_color: 0xE8ECF4
      text_font: montserrat_42
    - id: metric_label_style
      text_color: 0xB8C0D0
      text_font: montserrat_12
    - id: metric_value_style
      text_color: 0xE8ECF4
      text_font: montserrat_12
    - id: uptime_label_style
      text_color: 0x8A94A8
      text_font: montserrat_12
    - id: uptime_value_style
      text_color: 0xB8C0D0
      text_font: montserrat_12
    - id: gauge_caption_style
      text_color: 0xB8C0D0
      text_font: montserrat_10
    - id: arc_value_style
      text_color: 0xE8ECF4
      text_font: montserrat_14
    - id: arc_value_style_lg
      text_color: 0xE8ECF4
      text_font: montserrat_26
    - id: arc_caption_style_lg
      text_color: 0xB8C0D0
      text_font: montserrat_12
    - id: bar_track_style
      bg_color: 0x2A3142
      bg_opa: COVER
      radius: 5
    # Per-source accent: border + title color say whose data a card is.
    - id: card_border_rack
      border_color: 0x4FC3F7
    - id: card_border_weather
      border_color: 0xFFB74D
    - id: card_border_nas
      border_color: 0x81C784
    - id: card_border_network
      border_color: 0xBA68C8
    - id: card_border_manhattan
      border_color: 0x4DD0E1
    - id: card_border_ups
      border_color: 0xE57373
    - id: card_title_rack
      text_color: 0x4FC3F7
      text_font: montserrat_12
    - id: card_title_weather
      text_color: 0xFFB74D
      text_font: montserrat_12
    - id: card_title_nas
      text_color: 0x81C784
      text_font: montserrat_12
    - id: card_title_network
      text_color: 0xBA68C8
      text_font: montserrat_12
    - id: card_title_manhattan
      text_color: 0x4DD0E1
      text_font: montserrat_12
    - id: card_title_ups
      text_color: 0xE57373
      text_font: montserrat_12
    # Radial gauges: full-circle track (main) + rounded indicator.
    - id: arc_track_sm
      arc_color: 0x2A3142
      arc_width: 8
      arc_rounded: false
    - id: arc_track_lg
      arc_color: 0x2A3142
      arc_width: 14
      arc_rounded: false
    - id: arc_fill_nas
      arc_color: 0x81C784
      arc_width: 8
      arc_rounded: true
    - id: arc_fill_ups
      arc_color: 0xE57373
      arc_width: 8
      arc_rounded: true
    - id: arc_fill_manhattan_lg
      arc_color: 0x4DD0E1
      arc_width: 14
      arc_rounded: true
  pages:
    - id: page_home
      bg_color: 0x12141A
      bg_opa: COVER
      scrollable: false
      widgets:
        # Header: y 6..36
        - obj:
            x: 12
            y: 6
            width: 776
            height: 30
            styles: container_style
            scrollable: false
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: SPACE_BETWEEN
              flex_align_cross: CENTER
            widgets:
              - label:
                  styles: page_title_style
                  text: "Home Office Rack"
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  styles: container_style
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: ROW
                    flex_align_main: END
                    flex_align_cross: CENTER
                    pad_column: 10
                  widgets:
                    - label:
                        id: time_label
                        styles: page_title_style
                        text: "--:--"
                    - label:
                        id: outside_condition_label
                        styles: page_subtitle_style
                        text: "--"

        # Left rail: x 12..244
        - obj:
            x: 12
            y: 42
            width: 232
            height: 96
            scrollable: false
            styles:
              - card_style
              - card_border_rack
            widgets:
              - label:
                  x: 12
                  y: 8
                  styles: card_title_rack
                  text: "Rack Air"
              - label:
                  id: temp_label
                  align: BOTTOM_LEFT
                  x: 12
                  y: -8
                  styles: hero_value_style
                  text: "--°F"

        - obj:
            x: 12
            y: 146
            width: 232
            height: 326
            scrollable: false
            styles:
              - card_style
              - card_border_manhattan
            widgets:
              - label:
                  x: 12
                  y: 8
                  styles: card_title_manhattan
                  text: "Manhattan"
              - arc:
                  id: arc_manhattan_cpu
                  align: TOP_MID
                  y: 32
                  width: 160
                  height: 160
                  start_angle: 0
                  end_angle: 360
                  rotation: 270
                  adjustable: false
                  value: 0
                  min_value: 0
                  max_value: 100
                  styles: arc_track_lg
                  indicator:
                    styles: arc_fill_manhattan_lg
                  widgets:
                    - label:
                        id: manhattan_cpu_label
                        align: CENTER
                        y: -8
                        styles: arc_value_style_lg
                        text: "--%"
                    - label:
                        align: CENTER
                        y: 18
                        styles: arc_caption_style_lg
                        text: "CPU"
              - label:
                  x: 12
                  y: 212
                  styles: metric_label_style
                  text: "Memory"
              - bar:
                  id: bar_manhattan_mem
                  x: 70
                  y: 215
                  width: 86
                  height: 10
                  value: 0
                  min_value: 0
                  max_value: 100
                  styles: bar_track_style
                  indicator:
                    bg_color: 0x4DD0E1
                    bg_opa: COVER
                    radius: 5
              - label:
                  id: manhattan_mem_label
                  align: TOP_RIGHT
                  x: -12
                  y: 212
                  styles: metric_value_style
                  text: "--%"
              - label:
                  x: 12
                  y: 242
                  styles: metric_label_style
                  text: "Swap"
              - bar:
                  id: bar_manhattan_swap
                  x: 70
                  y: 245
                  width: 86
                  height: 10
                  value: 0
                  min_value: 0
                  max_value: 100
                  styles: bar_track_style
                  indicator:
                    bg_color: 0x4DD0E1
                    bg_opa: COVER
                    radius: 5
              - label:
                  id: manhattan_swap_label
                  align: TOP_RIGHT
                  x: -12
                  y: 242
                  styles: metric_value_style
                  text: "--%"
              - label:
                  align: BOTTOM_LEFT
                  x: 12
                  y: -12
                  styles: uptime_label_style
                  text: "Uptime"
              - label:
                  id: manhattan_uptime_label
                  align: BOTTOM_RIGHT
                  x: -12
                  y: -12
                  styles: uptime_value_style
                  text: "--"
        # Right column: x 256..788 (532 wide)
        - label:
            x: 256
            y: 42
            styles: section_header_style
            text: "Temperatures"

        - obj:
            x: 256
            y: 62
            width: 127
            height: 58
            scrollable: false
            styles:
              - card_style
              - card_border_weather
            widgets:
              - label:
                  align: TOP_MID
                  y: 7
                  styles: card_title_weather
                  text: "Outside"
              - label:
                  id: outside_temp_label
                  align: BOTTOM_MID
                  y: -7
                  styles: card_value_style
                  text: "--°F"

        - obj:
            x: 391
            y: 62
            width: 127
            height: 58
            scrollable: false
            styles:
              - card_style
              - card_border_nas
            widgets:
              - label:
                  align: TOP_MID
                  y: 7
                  styles: card_title_nas
                  text: "Vol 1 Disks"
              - label:
                  id: nas_vol1_temp_label
                  align: BOTTOM_MID
                  y: -7
                  styles: card_value_style
                  text: "--°F"

        - obj:
            x: 526
            y: 62
            width: 127
            height: 58
            scrollable: false
            styles:
              - card_style
              - card_border_nas
            widgets:
              - label:
                  align: TOP_MID
                  y: 7
                  styles: card_title_nas
                  text: "Vol 2 Disks"
              - label:
                  id: nas_vol2_temp_label
                  align: BOTTOM_MID
                  y: -7
                  styles: card_value_style
                  text: "--°F"

        - obj:
            x: 661
            y: 62
            width: 127
            height: 58
            scrollable: false
            styles:
              - card_style
              - card_border_manhattan
            widgets:
              - label:
                  align: TOP_MID
