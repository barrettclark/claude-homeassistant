# Kitchen dashboard firmware. See docs/superpowers/specs/
# 2026-09-11-kitchen-dashboard-firmware-design.md for the design this
# implements, and hardware/kitchen-dashboard/ASSEMBLY.md for the build.

esphome:
  name: kitchen-dashboard
  friendly_name: Kitchen Dashboard

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret kitchen_dashboard_api_key

ota:
  - platform: esphome
    password: !secret kitchen_dashboard_ota_password

# hardware_uart forced to UART0: this board's USB-C port runs through a
# discrete UART bridge chip, not the ESP32-S3's native USB peripheral —
# but that native peripheral is hard-wired to GPIO19/20 in silicon
# regardless, which would otherwise conflict with the I2C touch bus below.
logger:
  hardware_uart: UART0

# ESPHome will warn that GPIO19/20 are "used by the USB-Serial-JTAG
# interface" — that warning is generic to the ESP32-S3 chip and doesn't
# apply here now that the logger above is forced off that peripheral;
# these pins are free for I2C on this board. Expected, safe to ignore.
i2c:
  sda: GPIO19
  scl: GPIO20
  frequency: 400kHz

# Board is a DIYmalls/Sunton ESP32-8048S043C. The "ESP32-8048S050" model
# below is the closest built-in ESPHome model — its pin mapping
# (de/hsync/vsync/pclk + RGB data pins) matches this exact board (verified
# against the physical board's photos), even though the model name refers
# to the 5.0" sibling panel. Confirm timing looks right on first boot;
# override hsync_*/vsync_*/pclk_frequency here if the image is shifted or
# torn.
display:
  - platform: mipi_rgb
    id: kitchen_display
    model: ESP32-8048S050

touchscreen:
  platform: gt911
  id: kitchen_touch
  display: kitchen_display
  on_touch:
    - script.execute: wake_display

output:
  - platform: ledc
    pin: GPIO2
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: "Kitchen Dashboard Backlight"
    restore_mode: ALWAYS_ON
    internal: true

# PIR wake source (board header P4, pin IO17 — see the power/case specs
# for wiring). The MCU and WiFi stay running continuously; only the
# backlight is gated on idle, since ESPHome's LVGL + RGB display stack
# doesn't support true hardware light-sleep with instant GPIO wake and
# preserved UI state. This means real standby current will be higher
# than the power spec's light-sleep assumption — validate actual draw
# with a USB power meter and revisit the battery runtime target if needed.
binary_sensor:
  - platform: gpio
    id: pir_motion
    name: "Kitchen Dashboard Motion"
    device_class: motion
    pin:
      number: GPIO17
      mode: INPUT
    on_press:
      - script.execute: wake_display

  - platform: homeassistant
    id: christmas_season
    entity_id: binary_sensor.christmas_season
    on_press:
      - lvgl.widget.show: christmas_tile
    on_release:
      - lvgl.widget.hide: christmas_tile

  - platform: homeassistant
    id: fireplace_state
    entity_id: switch.fireplace

  - platform: homeassistant
    id: lamp_state
    entity_id: switch.tp_link_1

  # Christmas Lights switch-group helper — must be created in the HA UI
  # first (Settings > Devices & Services > Helpers > Create Helper >
  # Switch Group, combining switch.inside_christmas_lights,
  # switch.front_yard_christmas_lights, switch.back_patio_christmas_lights)
  # per the firmware spec's open item. Replace the entity_id below with
  # whatever ID that helper is actually assigned.
  - platform: homeassistant
    id: christmas_state
    entity_id: switch.christmas_lights_all

script:
  - id: wake_display
    mode: restart
    then:
      - light.turn_on: backlight
      - script.execute: idle_timer

  - id: idle_timer
    mode: restart
    then:
      - delay: 45s
      - light.turn_off: backlight

switch:
  - platform: template
    id: fireplace_switch
    name: "Fireplace"
    lambda: return id(fireplace_state).state;
    turn_on_action:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.fireplace
    turn_off_action:
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: switch.fireplace

  - platform: template
    id: lamp_switch
    name: "Stained Glass Lamp"
    lambda: return id(lamp_state).state;
    turn_on_action:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.tp_link_1
    turn_off_action:
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: switch.tp_link_1

  - platform: template
    id: christmas_switch
    name: "Christmas Lights"
    lambda: return id(christmas_state).state;
    turn_on_action:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.christmas_lights_all
    turn_off_action:
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: switch.christmas_lights_all

sensor:
  # --- Carrier climate zones: current temp + setpoint per zone ---
  - platform: homeassistant
    id: downstairs_current_temp
    entity_id: climate.living_room_downstairs
    attribute: current_temperature
  - platform: homeassistant
    id: downstairs_setpoint
    entity_id: climate.living_room_downstairs
    attribute: temperature

  - platform: homeassistant
    id: kids_current_temp
    entity_id: climate.living_room_kid_s_rooms
    attribute: current_temperature
  - platform: homeassistant
    id: kids_setpoint
    entity_id: climate.living_room_kid_s_rooms
    attribute: temperature

  - platform: homeassistant
    id: master_current_temp
    entity_id: climate.living_room_master_bedroom
    attribute: current_temperature
  - platform: homeassistant
    id: master_setpoint
    entity_id: climate.living_room_master_bedroom
    attribute: temperature

  # --- Tempest weather (weatherflow_cloud, station "coppell") ---
  - platform: homeassistant
    id: weather_temp
    entity_id: sensor.coppell_temperature
  - platform: homeassistant
    id: weather_feels_like
    entity_id: sensor.coppell_feels_like
  - platform: homeassistant
    id: weather_wind_speed
    entity_id: sensor.coppell_wind_speed
  - platform: homeassistant
    id: weather_humidity
    entity_id: sensor.coppell_relative_humidity
  - platform: homeassistant
    id: weather_uv_index
    entity_id: sensor.coppell_uv_index
  - platform: homeassistant
    id: weather_rain_today
    entity_id: sensor.coppell_precipitation_today

  # --- Enphase Envoy solar ---
  - platform: homeassistant
    id: solar_produce_w
    entity_id: sensor.envoy_202230068603_current_power_production
  - platform: homeassistant
    id: solar_consume_w
    entity_id: sensor.envoy_202230068603_current_power_consumption
  - platform: homeassistant
    id: solar_produce_today
    entity_id: sensor.envoy_202230068603_today_s_energy_production
  - platform: homeassistant
    id: solar_consume_today
    entity_id: sensor.envoy_202230068603_today_s_energy_consumption

text_sensor:
  - platform: homeassistant
    id: weather_wind_direction
    entity_id: sensor.coppell_wind_direction
  - platform: homeassistant
    id: downstairs_hvac_mode
    entity_id: climate.living_room_downstairs
  - platform: homeassistant
    id: kids_hvac_mode
    entity_id: climate.living_room_kid_s_rooms
  - platform: homeassistant
    id: master_hvac_mode
    entity_id: climate.living_room_master_bedroom

lvgl:
  displays:
    - kitchen_display
  touchscreens:
    - kitchen_touch
  pages:
    # ---------------- Page 1: Home ----------------
    - id: page_home
      widgets:
        - obj:
            x: 4
            y: 4
            width: 380
            height: 472
            layout:
              type: flex
              flex_flow: COLUMN
            widgets:
              - button:
                  widgets:
                    - label:
                        text: "Fireplace"
                  on_click:
                    - switch.toggle: fireplace_switch
              - button:
                  widgets:
                    - label:
                        text: "Stained Glass Lamp"
                  on_click:
                    - switch.toggle: lamp_switch
              - button:
                  id: christmas_tile
                  hidden: true
                  widgets:
                    - label:
                        text: "Christmas Lights"
                  on_click:
                    - switch.toggle: christmas_switch

        - obj:
            x: 392
            y: 4
            width: 404
            height: 472
            layout:
              type: flex
              flex_flow: COLUMN
            widgets:
              - obj:
                  widgets:
                    - label:
                        text: "Downstairs"
                    - label:
                        id: downstairs_temp_label
                        text:
                          format: "%.0f°"
                          args:
                            - !lambda return id(downstairs_current_temp).state;
                    - button:
                        widgets:
                          - label:
                              text: "-"
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.living_room_downstairs
                                temperature: !lambda return id(downstairs_setpoint).state - 0.5;
                    - button:
                        widgets:
                          - label:
                              text: "+"
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.living_room_downstairs
                                temperature: !lambda return id(downstairs_setpoint).state + 0.5;
              - obj:
                  widgets:
                    - label:
                        text: "Kid's Rooms"
                    - label:
                        id: kids_temp_label
                        text:
                          format: "%.0f°"
                          args:
                            - !lambda return id(kids_current_temp).state;
                    - button:
                        widgets:
                          - label:
                              text: "-"
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.living_room_kid_s_rooms
                                temperature: !lambda return id(kids_setpoint).state - 0.5;
                    - button:
                        widgets:
                          - label:
                              text: "+"
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.living_room_kid_s_rooms
                                temperature: !lambda return id(kids_setpoint).state + 0.5;
              - obj:
                  widgets:
                    - label:
                        text: "Master Bedroom"
                    - label:
                        id: master_temp_label
                        text:
                          format: "%.0f°"
                          args:
                            - !lambda return id(master_current_temp).state;
                    - button:
                        widgets:
                          - label:
                              text: "-"
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.living_room_master_bedroom
                                temperature: !lambda return id(master_setpoint).state - 0.5;
                    - button:
                        widgets:
                          - label:
                              text: "+"
                        on_click:
                          - homeassistant.service:
                              service: climate.set_temperature
                              data:
                                entity_id: climate.living_room_master_bedroom
                                temperature: !lambda return id(master_setpoint).state + 0.5;

    # ---------------- Page 2: Weather ----------------
    - id: page_weather
      widgets:
        - label:
            text: "Weather"
        - label:
            text:
              format: "%.0f°"
              args:
                - !lambda return id(weather_temp).state;
        - label:
            text:
              format: "Feels like %.0f°"
              args:
                - !lambda return id(weather_feels_like).state;
        - obj:
            layout:
              type: flex
              flex_flow: ROW_WRAP
            widgets:
              - obj:
                  widgets:
                    - label:
                        text: "Wind"
                    - label:
                        text:
                          format: "%.0f mph"
                          args:
                            - !lambda return id(weather_wind_speed).state;
              - obj:
                  widgets:
                    - label:
                        text: "Humidity"
                    - label:
                        text:
                          format: "%.0f%%"
                          args:
                            - !lambda return id(weather_humidity).state;
              - obj:
                  widgets:
                    - label:
                        text: "UV Index"
                    - label:
                        text:
                          format: "%.0f"
                          args:
                            - !lambda return id(weather_uv_index).state;
              - obj:
                  widgets:
                    - label:
                        text: "Rain Today"
                    - label:
                        text:
                          format: "%.2f in"
                          args:
                            - !lambda return id(weather_rain_today).state;

    # ---------------- Page 3: Solar ----------------
    - id: page_solar
      widgets:
        - label:
            text: "Solar"
        - obj:
            layout:
              type: flex
              flex_flow: ROW
            widgets:
              - obj:
                  widgets:
                    - label:
                        text: "Producing"
                    - label:
                        text:
                          format: "%.1f kW"
                          args:
                            - !lambda return id(solar_produce_w).state / 1000.0;
              - obj:
                  widgets:
                    - label:
                        text: "Using"
                    - label:
                        text:
                          format: "%.1f kW"
                          args:
                            - !lambda return id(solar_consume_w).state / 1000.0;
        - obj:
            layout:
              type: flex
              flex_flow: ROW
            widgets:
              - obj:
                  widgets:
                    - label:
                        text: "Today Produced"
                    - label:
                        text:
                          format: "%.1f kWh"
                          args:
                            - !lambda return id(solar_produce_today).state;
              - obj:
                  widgets:
                    - label:
                        text: "Today Used"
                    - label:
                        text:
                          format: "%.1f kWh"
                          args:
                            - !lambda return id(solar_consume_today).state;
